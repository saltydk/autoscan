name: Update base image

on:
  workflow_dispatch:
    inputs:
      refresh-base:
        description: Request the shared Alpine base refresh and defer this image update
        type: boolean
        default: false
  schedule:
    - cron: '19 */6 * * *'

permissions:
  contents: read

concurrency:
  group: autoscan-base-update
  cancel-in-progress: false

jobs:
  request-base-refresh:
    if: inputs.refresh-base
    runs-on: ubuntu-latest
    steps:
      - name: Request base image refresh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_TOKEN must have Actions write access to saltydk/docker-alpine-s6overlay to request a base refresh."
            exit 1
          fi
          gh workflow run request-refresh.yml --repo saltydk/docker-alpine-s6overlay --ref master
          echo "::notice::Shared base refresh requested. The next scheduled or manual image update will retry."
          echo "Shared base refresh requested. The next scheduled or manual image update will retry." >> "$GITHUB_STEP_SUMMARY"

  update:
    if: ${{ !inputs.refresh-base }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      master-rebuild: ${{ steps.source.outputs.master-rebuild }}
      release-rebuild: ${{ steps.source.outputs.release-rebuild }}
      release-tag: ${{ steps.source.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Resolve and verify standard base
        id: standard
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/image.py base update --write --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/image.py --recipe master base verify
          python3 scripts/image.py --recipe release base verify
      - name: Resolve and verify nonroot base
        id: nonroot
        run: |
          python3 scripts/image.py --variant nonroot base update --write --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/image.py --recipe master --variant nonroot base verify
          python3 scripts/image.py --recipe release --variant nonroot base verify
      - name: Commit resolved pin
        if: steps.standard.outputs.changed == 'true' || steps.nonroot.outputs.changed == 'true'
        run: |
          git add docker/master/Dockerfile docker/release/Dockerfile docker/master/Dockerfile.nonroot docker/release/Dockerfile.nonroot
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(docker): refresh verified base image'
          git push origin HEAD:master
      - name: Detect pending master and latest publication
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/image.py refresh-status --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  master:
    needs: update
    if: needs.update.outputs.master-rebuild == 'true'
    uses: ./.github/workflows/build.yml
    with:
      source-sha: ${{ needs.update.outputs.source-sha }}
    secrets: inherit

  latest:
    needs: update
    if: needs.update.outputs.release-rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nonroot]
    uses: ./.github/workflows/docker.yml
    with:
      recipe: release
      variant: ${{ matrix.variant }}
      source-sha: ${{ needs.update.outputs.source-sha }}
      source-ref: refs/heads/master
      release-tag: ${{ needs.update.outputs.release-tag }}
    secrets: inherit
