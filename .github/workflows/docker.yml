name: Docker image

on:
  workflow_call:
    inputs:
      recipe:
        description: Runtime recipe to build (master or release)
        required: true
        type: string
      variant:
        description: Runtime variant (standard or nonroot)
        default: standard
        type: string
      source-sha:
        description: Exact commit containing the runtime recipe
        required: true
        type: string
      source-ref:
        description: Branch or tag selecting the image publication policy
        required: true
        type: string
      release-tag:
        description: Published application release supplying stable binaries
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: autoscan-docker-${{ inputs.recipe }}-${{ inputs.variant }}-${{ inputs.recipe == 'master' && inputs.source-ref || 'latest' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      binary-sha: ${{ steps.inputs.outputs.binary-sha }}
      short-sha: ${{ steps.inputs.outputs.short-sha }}
      version: ${{ steps.inputs.outputs.version }}
      tags: ${{ steps.inputs.outputs.tags }}
      binary-artifact: ${{ inputs.recipe == 'release' && format('docker-binaries-release-{0}', inputs.variant) || 'docker-binaries-master' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Select binary and publication inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ inputs.recipe }}
          VARIANT: ${{ inputs.variant }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          SOURCE_REF: ${{ inputs.source-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 scripts/image.py --recipe "$RECIPE" --variant "$VARIANT" prepare \
            --source-sha "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
            --release-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: inputs.recipe == 'release'
        with:
          name: docker-binaries-release-${{ inputs.variant }}
          path: dist/docker/
          if-no-files-found: error

  test-image:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            slug: amd64
          - platform: linux/arm64
            arch: aarch64
            slug: arm64
          - platform: linux/arm/v7
            arch: armv7l
            slug: armv7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.binary-artifact }}
          path: docker/${{ inputs.recipe }}/binaries
      - name: Restore executable bits
        env:
          RECIPE: ${{ inputs.recipe }}
        run: chmod +x "docker/$RECIPE/binaries/"*/autoscan
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate
        uses: docker/build-push-action@v7
        with:
          context: docker/${{ inputs.recipe }}
          file: docker/${{ inputs.recipe }}/${{ inputs.variant == 'nonroot' && 'Dockerfile.nonroot' || 'Dockerfile' }}
          platforms: ${{ matrix.platform }}
          load: true
          pull: true
          tags: local/autoscan:${{ matrix.slug }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.autoscan.binary.revision=${{ needs.prepare.outputs.binary-sha }}
            io.autoscan.variant=${{ inputs.variant }}
          cache-from: type=gha,scope=autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }}
          cache-to: type=gha,scope=autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }},mode=max
      - name: Test runtime
        id: runtime
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          IMAGE: local/autoscan:${{ matrix.slug }}
          BINARY_SHORT_SHA: ${{ needs.prepare.outputs.short-sha }}
          VARIANT: ${{ inputs.variant }}
        run: scripts/test-image.sh "$IMAGE" "$PLATFORM" "$ARCH" "$BINARY_SHORT_SHA" "$VARIANT"
      - name: Scan candidate with shared container tooling
        id: security
        if: ${{ !cancelled() }}
        uses: saltyorg/github-actions/container-scan@v1.3.3
        with:
          image: local/autoscan:${{ matrix.slug }}
          name: autoscan-${{ inputs.recipe }}-${{ inputs.variant }}
          platform: ${{ matrix.platform }}
          output-directory: security/${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }}
          scout-enabled: ${{ github.event_name != 'pull_request' }}
          enforce-kev: ${{ github.event_name != 'pull_request' }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retain candidate security reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: autoscan-security-candidate-autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }}
          path: security/${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }}
          if-no-files-found: warn

      - name: Report candidate outcomes
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          BINARY_SHA: ${{ needs.prepare.outputs.binary-sha }}
          VARIANT: ${{ inputs.variant }}
          RUNTIME: ${{ steps.runtime.outcome }}
          SECURITY_REPORT: ${{ steps.security.outputs.report-status }}
          KEV: ${{ steps.security.outputs.kev-status }}
        run: |
          python3 -m scripts.publication candidate --platform "$PLATFORM" --source-sha "$SOURCE_SHA" \
            --binary-sha "$BINARY_SHA" --variant "$VARIANT" --runtime "$RUNTIME" \
            --security-report "$SECURITY_REPORT" --kev "$KEV" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-${{ inputs.recipe }}-${{ inputs.variant }}-${{ matrix.slug }}
          path: candidate.json
          if-no-files-found: error

  publish-image:
    concurrency:
      group: autoscan-publication
      queue: max
      cancel-in-progress: false
    needs: [prepare, test-image]
    if: needs.prepare.outputs.tags != '[]'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.promotion.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RECIPE: ${{ inputs.recipe }}
      VARIANT: ${{ inputs.variant }}
      SOURCE_SHA: ${{ inputs.source-sha }}
      SOURCE_REF: ${{ inputs.source-ref }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      BINARY_SHA: ${{ needs.prepare.outputs.binary-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.binary-artifact }}
          path: docker/${{ inputs.recipe }}/binaries
      - run: chmod +x "docker/$RECIPE/binaries/"*/autoscan
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Check publication eligibility
        id: eligibility
        run: |
          python3 scripts/image.py --recipe "$RECIPE" --variant "$VARIANT" check-promotion \
            --source-ref "$SOURCE_REF" --source-sha "$SOURCE_SHA" \
            --release-tag "$RELEASE_TAG" --binary-sha "$BINARY_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Publish immutable candidate
        id: image
        if: steps.eligibility.outputs.eligible == 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker/${{ inputs.recipe }}
          file: docker/${{ inputs.recipe }}/${{ inputs.variant == 'nonroot' && 'Dockerfile.nonroot' || 'Dockerfile' }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          sbom: true
          tags: saltydk/autoscan:sha-${{ inputs.source-sha }}-${{ inputs.recipe }}-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            io.autoscan.binary.revision=${{ needs.prepare.outputs.binary-sha }}
            io.autoscan.variant=${{ inputs.variant }}
          cache-from: |
            type=gha,scope=autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-amd64
            type=gha,scope=autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-arm64
            type=gha,scope=autoscan-${{ inputs.recipe }}-${{ inputs.variant }}-armv7
      - name: Verify and promote accepted manifest
        id: promotion
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          python3 -m scripts.publication promote --recipe "$RECIPE" --variant "$VARIANT" \
            --source-ref "$SOURCE_REF" --source-sha "$SOURCE_SHA" --release-tag "$RELEASE_TAG" \
            --binary-sha "$BINARY_SHA" --image-digest "$IMAGE_DIGEST" --version "$VERSION" \
            --tags "$TAGS" --github-output "$GITHUB_OUTPUT"
      - name: Retain publication records
        if: ${{ always() && hashFiles('publication-attempts.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: published-images-${{ inputs.recipe }}-${{ inputs.variant }}
          path: |
            publication-attempts.txt
            published.txt
          if-no-files-found: warn

  acceptance:
    if: always()
    needs: [prepare, test-image, publish-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
      - name: Summarize image acceptance
        env:
          PREPARE: ${{ needs.prepare.result }}
          TESTS: ${{ needs.test-image.result }}
          PUBLISH: ${{ needs.publish-image.result }}
          PUBLISHED: ${{ needs.publish-image.outputs.published }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          python3 -m scripts.publication summarize --prepare "$PREPARE" --tests "$TESTS" \
            --publish "$PUBLISH" --published "$PUBLISHED" --tags "$TAGS" --summary "$GITHUB_STEP_SUMMARY"

  published-security:
    needs: [prepare, publish-image]
    if: ${{ !cancelled() && needs.publish-image.result == 'success' && needs.publish-image.outputs.published == 'true' }}
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/security-scan.yml
    with:
      artifact-prefix: ${{ inputs.recipe }}-${{ inputs.variant }}
    secrets: inherit
