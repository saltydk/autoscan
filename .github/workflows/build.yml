name: Build

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        description: Exact committed source selected by the base updater
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autoscan-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - name: Record source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Check image tooling and base
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/image.py base verify
          shellcheck scripts/test-image.sh
          shellcheck -s sh docker/master/run docker/release/run
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: '-ignore "unexpected key .queue. for .concurrency. section"'
      - uses: ./.github/actions/prepare-go
      - name: Build snapshot
        run: task snapshot
      - name: Stage Docker binaries
        run: python3 scripts/image.py stage
      - uses: actions/upload-artifact@v7
        with:
          name: docker-binaries-master
          path: dist/docker/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: build_linux
          path: dist/*linux*
      - uses: actions/upload-artifact@v7
        with:
          name: build_darwin
          path: dist/*darwin*

  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nonroot]
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/docker.yml
    with:
      recipe: master
      variant: ${{ matrix.variant }}
      source-sha: ${{ needs.build.outputs.source-sha }}
      source-ref: ${{ github.ref }}
    secrets: inherit

  acceptance:
    if: always()
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require binary and image checks
        env:
          BUILD: ${{ needs.build.result }}
          IMAGE: ${{ needs.image.result }}
        run: '[[ "$BUILD" == success && "$IMAGE" == success ]]'
