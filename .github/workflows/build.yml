name: Build

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup go
      - name: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go info
        run: |
          go version
          go env

      # dependencies
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: v2.18.1

      - name: goreleaser info
        run: goreleaser -v

      - name: task
        uses: arduino/setup-task@v3
        with:
          version: 3.53.1

      - name: task info
        run: task --version

      - name: qemu
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/setup-qemu-action@v4

      - name: buildx
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/setup-buildx-action@v4

      - name: cache-task
        uses: actions/cache@v6
        with:
          path: .task/**/*
          key: ${{ runner.os }}-go-task

      # vendor
      - name: vendor
        run: |
          task vendor

      # test
      - name: tests
        run: |
          task test

      # git status
      - name: git status
        run: git status

      # build
      - name: build
        if: startsWith(github.ref, 'refs/tags/') == false
        run: |
          task snapshot

      # publish
      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          task publish

      # docker context
      - name: prepare docker context
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          set -euo pipefail

          stage_binary() {
            local goarch="$1"
            local goarm="$2"
            local destination="$3"
            local source

            source=$(jq -r \
              --arg goarch "$goarch" \
              --arg goarm "$goarm" \
              '[.[] | select(
                .type == "Binary"
                and .goos == "linux"
                and .goarch == $goarch
                and ((.goarm // "") == $goarm)
              )][0].path // empty' \
              dist/artifacts.json)

            test -n "$source"
            install -Dm755 "$source" "$destination"
          }

          stage_binary amd64 "" dist/docker/linux_amd64/autoscan
          stage_binary arm64 "" dist/docker/linux_arm64/autoscan
          stage_binary arm 7 dist/docker/linux_arm_7/autoscan

      # artifacts
      - name: artifact_linux
        uses: actions/upload-artifact@v7
        with:
          name: build_linux
          path: dist/*linux*

      - name: artifact_darwin
        uses: actions/upload-artifact@v7
        with:
          name: build_darwin
          path: dist/*darwin*

      # docker login
      - name: docker login
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # docker build (latest & tag)
      - name: release tag
        if: startsWith(github.ref, 'refs/tags/') == true
        id: releasetag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: docker - build release
        if: startsWith(github.ref, 'refs/tags/') == true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            saltydk/autoscan:${{ steps.releasetag.outputs.tag }}
            saltydk/autoscan:latest

      # docker build (branch)
      - name: docker tag
        if: startsWith(github.ref, 'refs/tags/') == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        id: dockertag
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          tag=$(printf '%s' "$BRANCH_NAME" | sed -E 's/[:.\/]+/-/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: docker - build branch
        if: startsWith(github.ref, 'refs/tags/') == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          pull: true
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            saltydk/autoscan:${{ steps.dockertag.outputs.tag }}
