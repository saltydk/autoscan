name: Build

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        description: Exact committed source selected by the base updater
        required: true
        type: string
      skip-published-security:
        description: Leave the published image scan to the caller
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: autoscan-build
  queue: max
  cancel-in-progress: false

jobs:
  # The scripts run on the runner's python3, tested by the build job; this
  # job tests the oldest and newest supported Python releases.
  python-bounds:
    name: python-bounds (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.10'
          - '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Record Python version
        run: python3 -VV
      - name: Run unit tests with warnings as errors
        env:
          PYTHONWARNINGS: error
          PYTHONDEVMODE: '1'
        run: |
          set -o pipefail
          python3 -W error -X dev -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # Leaks found during garbage collection are reported, not raised.
          if grep -nE 'Exception ignored|[A-Za-z]+Warning: ' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::Python reported warnings or unraisable exceptions"
            exit 1
          fi
      - name: Compile Python scripts with warnings as errors
        run: python3 -W error -X dev -m compileall -q -f scripts tests

  build:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - name: Record source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Run unit tests with warnings as errors
        env:
          PYTHONWARNINGS: error
          PYTHONDEVMODE: '1'
        run: |
          set -o pipefail
          python3 -W error -X dev -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # Leaks found during garbage collection are reported, not raised.
          if grep -nE 'Exception ignored|[A-Za-z]+Warning: ' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::Python reported warnings or unraisable exceptions"
            exit 1
          fi
      - name: Check image tooling and base
        run: |
          python3 scripts/image.py base verify
          shellcheck scripts/test-image.sh
          shellcheck -s sh docker/master/run docker/release/run
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # actionlint 1.7.12 predates create-github-app-token's client-id input (app-id is deprecated).
          args: >-
            -ignore "unexpected key .queue. for .concurrency. section"
            -ignore "input .client-id. is not defined in action .actions/create-github-app-token@v3."
            -ignore "missing input .app-id. which is required by action .actions/create-github-app-token@v3."
      - uses: ./.github/actions/prepare-go
      - name: Build snapshot
        run: task snapshot
      - name: Stage Docker binaries
        run: python3 scripts/image.py stage
      - uses: actions/upload-artifact@v7
        with:
          name: docker-binaries-master
          path: dist/docker/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: build_linux
          path: dist/*linux*
      - uses: actions/upload-artifact@v7
        with:
          name: build_darwin
          path: dist/*darwin*

  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nonroot]
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/docker.yml
    with:
      recipe: master
      variant: ${{ matrix.variant }}
      source-sha: ${{ needs.build.outputs.source-sha }}
      source-ref: ${{ github.ref }}
    secrets: inherit

  # One scan of every published tag per run, after all variants have published.
  # Scanning inside docker.yml ran the same twelve-target scan once per variant
  # and took the shared publication lock twice.
  published-security:
    needs: [image]
    if: ${{ !cancelled() && !inputs.skip-published-security && needs.image.result != 'skipped' && needs.image.outputs.tags != '' && needs.image.outputs.tags != '[]' }}
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/security-scan.yml
    with:
      artifact-prefix: master
    secrets: inherit

  acceptance:
    if: always()
    needs: [build, image, published-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source-sha || inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - name: Require binary and image checks
        env:
          BUILD: ${{ needs.build.result }}
          IMAGE: ${{ needs.image.result }}
          SECURITY: ${{ needs.published-security.result }}
        run: python3 -m scripts.publication summarize-build --build "$BUILD" --images "$IMAGE" --security "$SECURITY"
