name: Authenticated Docker Scout
description: Prepare the pinned Scout binary with GitHub authentication before scanning

inputs:
  command:
    description: Scout command
    required: true
  image:
    description: Image to analyze
    required: true
  platform:
    description: Image platform to analyze
    required: true
  github-token:
    description: GitHub token for authenticated release downloads
    default: ${{ github.token }}
  dockerhub-user:
    description: Docker Hub username
    required: true
  dockerhub-password:
    description: Docker Hub token
    required: true
  sarif-file:
    description: Optional SARIF report path
    default: ''
  only-fixed:
    description: Filter to fixable vulnerabilities
    default: 'false'
  only-severities:
    description: Vulnerability severity filter
    default: ''
  only-cisa-kev:
    description: Filter to CISA KEV findings
    default: 'false'
  exit-code:
    description: Fail when matching vulnerabilities are found
    default: 'false'
  summary:
    description: Write the Scout job summary
    default: 'true'
  write-comment:
    description: Write a pull request comment
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare authenticated Scout download
      id: prepare
      if: ${{ !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: python3 "$GITHUB_ACTION_PATH/prepare.py"

    - name: Run Docker Scout
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      # This is the only Scout version pin. prepare.py reads this reference.
      uses: docker/scout-action@v1.26.0
      with:
        command: ${{ inputs.command }}
        image: ${{ inputs.image }}
        platform: ${{ inputs.platform }}
        github-token: ${{ inputs.github-token }}
        dockerhub-user: ${{ inputs.dockerhub-user }}
        dockerhub-password: ${{ inputs.dockerhub-password }}
        sarif-file: ${{ inputs.sarif-file }}
        only-fixed: ${{ inputs.only-fixed }}
        only-severities: ${{ inputs.only-severities }}
        only-cisa-kev: ${{ inputs.only-cisa-kev }}
        exit-code: ${{ inputs.exit-code }}
        summary: ${{ inputs.summary }}
        write-comment: ${{ inputs.write-comment }}
