name: Prepare and verify Go
description: Install the binary build tools and run the shared Go checks
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - uses: goreleaser/goreleaser-action@v7
      with:
        install-only: true
        version: v2.18.3
    - uses: arduino/setup-task@v3
      with:
        version: 3.54.0
    - name: Check Go module files
      shell: bash
      run: go mod tidy -diff
    - name: Vendor Go dependencies
      shell: bash
      run: task vendor
    - name: Run Go tests
      shell: bash
      run: task test
    - name: Vet Go code
      shell: bash
      run: go vet ./...
    - name: Verify Go module checksums
      shell: bash
      run: go mod verify
    - name: Check Go vulnerabilities
      id: govulncheck
      shell: bash
      run: >-
        python3 scripts/go_vulnerabilities.py
        --tool golang.org/x/vuln/cmd/govulncheck@v1.8.0
        --output-directory "$RUNNER_TEMP/go-vulnerabilities"
    - name: Retain Go vulnerability report
      if: ${{ always() && steps.govulncheck.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: go-vulnerabilities-${{ github.job }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/go-vulnerabilities/
        if-no-files-found: warn
